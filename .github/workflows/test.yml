# ═══════════════════════════════════════════════════════════════════════════════
#  CI — Examination Management System test suite.
#
#  Layout mirrors the four test layers:
#    • frontend      — vitest (jsdom + msw), no network, always runs.
#    • backend-unit  — pure algorithm/parser tests, NO DB, always runs.
#    • backend-integration — supertest against the LIVE Aiven DB; runs ONLY when
#      DB secrets are configured. Serialized via a shared concurrency group so two
#      runs never race the shared instance or its active-period flag.
#    • e2e (Playwright) — nightly + manual only; boots both servers, flips the
#      active period (global-setup) and restores it (global-teardown). Shares the
#      SAME `live-db` concurrency group as integration so they never overlap.
#
#  Live-DB safety: every test row is __TEST_/__TEST_E2E_ prefixed and swept in
#  teardown; RUN_DESTRUCTIVE defaults to 0 so the active period is never wiped.
#  TEST_RUN_ID=${{ github.run_id }} keeps each run's prefixes unique.
#
#  Required repo secrets: DB_HOST, DB_USER, DB_PASSWORD, DB_NAME, DB_PORT,
#  JWT_SECRET. Optional: SMTP_* (OTP stubs nodemailer when absent).
# ═══════════════════════════════════════════════════════════════════════════════
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly → e2e job

permissions:
  contents: read

jobs:
  # ── Frontend component tests (jsdom + msw, no DB, no network) ───────────────
  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  # ── Backend unit tests (algorithms + parsing, zero DB risk) ─────────────────
  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:unit
        working-directory: backend

  # ── Backend integration tests (LIVE DB; only when secrets present) ──────────
  backend-integration:
    name: backend integration (live DB)
    runs-on: ubuntu-latest
    needs: backend-unit
    # Serialize ALL live-DB jobs (integration + e2e) across runs so they never
    # race the shared instance or its active-period flag. Do NOT cancel in
    # progress — a half-cancelled run could leave the active flag flipped.
    concurrency:
      group: live-db
      cancel-in-progress: false
    env:
      NODE_ENV: test
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RUN_DESTRUCTIVE: '0'
      TEST_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # `env` context IS allowed in step-level `if`; gate on the DB secret so
      # forks / secret-less repos still get a green (skipped) integration step.
      - name: Integration + coverage
        if: ${{ env.DB_HOST != '' }}
        run: npm run test:coverage
        working-directory: backend
      - name: No DB secrets — skipping integration
        if: ${{ env.DB_HOST == '' }}
        run: echo "DB_HOST secret not set; skipping live-DB integration tests."
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.DB_HOST != '' }}
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: ignore

  # ── E2E (Playwright) — nightly + manual only; boots both servers ────────────
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [frontend, backend-unit]
    # Same live-DB group as integration → the two never run at the same time.
    concurrency:
      group: live-db
      cancel-in-progress: false
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RUN_DESTRUCTIVE: '0'
      TEST_RUN_ID: ${{ github.run_id }}
      E2E_START_SERVERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Guard — require DB secrets
        if: ${{ env.DB_HOST == '' }}
        run: |
          echo "::error::E2E needs DB secrets (DB_HOST … JWT_SECRET). Aborting."
          exit 1
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E journeys
        run: npm run test:e2e
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
